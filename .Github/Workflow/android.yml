name: Construir APK del laboratorio

on: [push, workflow_dispatch]

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraer proyecto
        run: |
          unzip -o Laboratorio_Seguridad_Android_Proyecto.zip -d proyecto
          find proyecto \( -name settings.gradle -o -name settings.gradle.kts \)

      - name: Compilar APK
        run: |
          ARCHIVO=$(find proyecto \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$ARCHIVO"
          cd "$(dirname "$ARCHIVO")"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Laboratorio-de-seguridad-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          
