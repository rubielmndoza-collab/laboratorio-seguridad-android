name: Construir APK del laboratorio

on:
  workflow_dispatch:
  push:
    paths:
      - 'Laboratorio_Seguridad_Android_Proyecto.zip'
      - '.github/workflows/android.yml'

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extraer proyecto del laboratorio
        run: |
          unzip -o Laboratorio_Seguridad_Android_Proyecto.zip -d proyecto
          find proyecto -name settings.gradle -o -name settings.gradle.kts

      - name: Compilar APK
        run: |
          DIR="$(dirname "$(find proyecto -name settings.gradle -o -name settings.gradle.kts | head -n 1)")"
          test -n "$DIR"
          cd "$DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Laboratorio-de-seguridad-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          
